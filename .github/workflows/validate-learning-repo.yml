name: Validate learning repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required learning files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/system-design-learning.md
          test -f docs/cloud-platform-map.md
          test -f docs/project-board.md
          test -f .github/ISSUE_TEMPLATE/system-design-lesson.md
          test -f .github/pull_request_template.md
